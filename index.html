<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد امتحانات الثانوية العامة 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #34495e;
            color: white;
            font-size: 1.1rem;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .countdown {
            font-family: monospace;
            font-size: 1.15rem;
            font-weight: bold;
            color: #e74c3c;
            direction: ltr;
            display: inline-block;
        }
        .finished {
            color: #27ae60;
            font-weight: bold;
        }
        .subject-tag {
            font-size: 0.85rem;
            color: #7f8c8d;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <h1>⏱️ العداد التنازلي لامتحانات الثانوية العامة 2026</h1>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>المادة والشعبة</th>
                    <th>التاريخ</th>
                    <th>الوقت المتبقي (أيام : ساعات : دقائق : ثوانٍ)</th>
                </tr>
            </thead>
            <tbody id="exam-table-body">
                </tbody>
        </table>
    </div>

    <script>
        // بيانات الامتحانات المعدة مسبقاً (سنة 2026) الساعة 9 صباحاً
        const exams = [
            { id: 1, name: "التربية الدينية والوطنية", branch: "العامة", date: "2026-06-21T09:00:00" },
            { id: 2, name: "اللغة الأجنبية الثانية", branch: "العامة", date: "2026-06-23T09:00:00" },
            { id: 3, name: "اللغة العربية", branch: "العامة", date: "2026-06-28T09:00:00" },
            { id: 4, name: "الكيمياء / الجغرافيا", branch: "العلوم والرياضيات / الأدبية", date: "2026-07-02T09:00:00" },
            { id: 5, name: "اللغة الأجنبية الأولى", branch: "العامة", date: "2026-07-05T09:00:00" },
            { id: 6, name: "الفيزياء / التاريخ", branch: "العلوم والرياضيات / الأدبية", date: "2026-07-09T09:00:00" },
            { id: 7, name: "الرياضيات (البحتة)", branch: "الرياضيات", date: "2026-07-12T09:00:00" },
            { id: 8, name: "الأحياء / التطبيقية / الإحصاء", branch: "العلوم / الرياضيات / الأدبية", date: "2026-07-16T09:00:00" }
        ];

        function initTable() {
            const tbody = document.getElementById('exam-table-body');
            tbody.innerHTML = '';
            exams.forEach(exam => {
                const formattedDate = new Date(exam.date).toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <strong>${exam.name}</strong>
                        <span class="subject-tag">(${exam.branch})</span>
                    </td>
                    <td>${formattedDate}</td>
                    <td><span class="countdown" id="count-${exam.id}">جاري الحساب...</span></td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateCountdowns() {
            const now = new Date().getTime();

            exams.forEach(exam => {
                const examDate = new Date(exam.date).getTime();
                const distance = examDate - now;
                const element = document.getElementById(`count-${exam.id}`);

                if (distance < 0) {
                    element.innerHTML = "<span class='finished'>انتهى أو بدأ الامتحان</span>";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                // تنسيق الأرقام لتظهر بخانتين دائماً (مثل 05 بدلاً من 5)
                const d = String(days).padStart(2, '0');
                const h = String(hours).padStart(2, '0');
                const m = String(minutes).padStart(2, '0');
                const s = String(seconds).padStart(2, '0');

                element.innerText = `${d}d : ${h}h : ${m}m : ${s}s`;
            });
        }

        // تشغيل العداد
        initTable();
        updateCountdowns();
        setInterval(updateCountdowns, 1000);
    </script>
</body>
</html>
